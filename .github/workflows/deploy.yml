name: Deploy Pulsar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 11:55 上海時間（03:55 UTC）開始重建，12:00 前就緒；pipeline 在 11:15 結束
    - cron: '55 3 * * *'

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin to v10 — pnpm 11.x (released ~2026-05) treats
          # ERR_PNPM_IGNORED_BUILDS as a hard install failure even with
          # `pnpm.onlyBuiltDependencies` whitelist in package.json,
          # which broke our CI starting 2026-05-08.
          version: 10

      - name: Verify isolated data sync
        run: |
          python3 -B scripts/test_sync_data.py -v
          python3 -B scripts/test_theory_inventory.py -v
          bash -n scripts/ci-sync-data.sh scripts/test-ci-sync-data.sh
          bash scripts/test-ci-sync-data.sh

      - name: Sync pipeline data via SSH
        id: ssh_sync
        env:
          SSH_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        if: ${{ env.SSH_KEY != '' }}
        continue-on-error: true   # fallback: use committed src/data/ if SSH fails
        run: bash scripts/ci-sync-data.sh

      - name: Report pipeline data fallback
        if: ${{ steps.ssh_sync.outcome != 'success' }}
        run: |
          echo "::warning::Fresh server data export was unavailable. Building with committed data and available GitHub reports; source dates remain authoritative."
          echo "Fresh server export unavailable (${{ steps.ssh_sync.outcome }}). This build uses committed data and available GitHub reports. Check displayed source dates." >> "$GITHUB_STEP_SUMMARY"

      - name: Restore force-committed data files
        run: |
          # -r recurses into subdirs (e.g. src/data/ontology/) so we list
          # blobs only. Without -r, directories show up as names and fail
          # the `git show > "$f"` redirect.
          git ls-tree -r --name-only HEAD src/data/ | while read f; do
            if [ ! -f "$f" ]; then
              echo "Restoring missing: $f"
              mkdir -p "$(dirname "$f")"
              git show "HEAD:$f" > "$f"
            fi
          done
          echo "Data files in src/data/:"
          ls -la src/data/*.json 2>/dev/null | wc -l

      - name: Sync markdown from GitHub repos (always runs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Syncing markdown from GitHub repos..."
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          YESTERDAY=$(TZ=Asia/Shanghai date -d '-1 day' +%Y-%m-%d)

          TOKEN="${{ secrets.DEPLOY_GH_TOKEN }}"
          [ -z "$TOKEN" ] && TOKEN="$GH_TOKEN"
          API="https://api.github.com"
          AUTH="Authorization: token $TOKEN"

          # Helper: download file from repo (skip if already exists and non-empty)
          dl() {
            local repo="$1" path="$2" dest="$3"
            [ -s "$dest" ] && return 0  # already synced via SSH
            local content
            content=$(curl -sH "$AUTH" "$API/repos/sou350121/$repo/contents/$path" | python3 -c "import sys,json; print(json.load(sys.stdin).get('content',''))" 2>/dev/null)
            if [ -n "$content" ] && [ "$content" != "None" ]; then
              echo "$content" | base64 -d > "$dest"
              echo "  ✓ $dest"
              return 0
            fi
            return 1
          }

          # Download recent markdown archives (today + yesterday)
          for d in "$TODAY" "$YESTERDAY"; do
            dl "VLA-Handbook" "memory/blog/archives/vla-social-intel/${d}.md" "src/data/_vla_social_${d}.md" || true
            dl "Agent-Playbook" "memory/blog/archives/ai-social-intel/${d}.md" "src/data/_ai_social_${d}.md" || true
            dl "Agent-Playbook" "memory/blog/archives/ai-daily-pick/${d}.md" "src/data/_ai_daily_pick_${d}.md" || true
          done

          echo "Markdown sync complete."
          ls src/data/*"${TODAY}"* src/data/*"${YESTERDAY}"* 2>/dev/null || echo "No new dated files"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec astro check
        continue-on-error: true

      - name: Build Astro site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
